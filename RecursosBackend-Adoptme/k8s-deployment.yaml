apiVersion: apps/v1
kind: Deployment
metadata:
  name: adopt-me
  labels:
    app: backend-adoptme
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-adoptme
  template:
    metadata:
      labels:
        app: backend-adoptme
    spec:
      containers:
        - name: backend-adoptme
          image: backend-adoptme:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: backend-adoptme
  labels:
    app: backend-adoptme
spec:
  type: NodePort
  selector:
    app: backend-adoptme
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: 30080
